events:
  - category: UI
    title: "Polaroid UI类似于拍立得的小组件"
    date: "2026-7-21"
    to: "/ui/polaroid"
    src: "/polaroid.png"
    description: "该组件来源于https://github.com/nuxt-ui-templates/portfolio项目, 是一个类似于拍立得的邮票组件, 感觉可以等我找到女友后做那种邮票情头的双人站就保留下来了.还可以使用到照片墙项目的部分, 总之感觉很好就想要, 就夺舍了..."
  - category: UI
    title: "ColorModeButton 带有动画的切换主题的按钮"
    date: "2026-7-23"
    to: "/ui/color-mode-button"
    src: "/ColorModeButton.png"
    description: "该组件来源于https://github.com/nuxt-ui-templates/portfolio项目, 常用的页面切换主题的按钮, 比Ai写的好看一百倍, 动画丝滑, 而且理解之后很适合改造, 所以直接扣下来了..."
  - category: Animation
    title: "ShutterReveal 快门切片动画"
    date: "2026-07-27"
    to: "/animation/shutter-reveal"
    src: "/ShutterReveal.png"
    description: "来源于 fqzlr.com 首页滚动快门效果的学习复刻, 修改成了无滚动的形式, 驱动 5 个竖向切片按奇偶方向进入, 最后合成完整图片。"
  - category: Animation
    title: "WaveReveal + Logo Stroke 波浪揭示动画"
    date: "2026-07-28"
    to: "/animation/wave-reveal"
    src: "/WaveReveal.png"
    description: "从 BenjaminOddou/portfolio项目中提取, 进行实验收进来的预加载动画展示版, 用stroke-dasharray + stroke-dashoffset 做Logo 先做描边和填充, 再由GSAP控制波浪形 SVG 推进完成转场。适合网站一开始进入加载资源的时候的预加载动画。"
  - category: Animation
    title: "InteractiveIconMorph 交互式图标形变动画"
    date: "2026-07-29"
    to: "/animation/interactive-icon-morph"
    src: "/InteractiveIconMorph.png"
    description: "从 BenjaminOddou/portfolio项目中提取, 实验之后收藏进来的交互式菜单图标动画, 鼠标悬停时用 GSAP 驱动 SVG 路径形变, 使用了GSAP的MorphSVG插件，并配合环形文字旋转。感觉好看的底部社交图标。"
