    .n { --length: 1480; animation-delay: 2.15s; }
    .glyph, .complete { fill: white; stroke: white; stroke-width: 32; stroke-linejoin: round; }
    .complete { opacity: 0; animation: finish .2s forwards; }
    .complete.s { animation-delay: 1.18s; }
    .complete.i { animation-delay: 2.12s; }
    .complete.n { animation-delay: 3.18s; }
    .dot { fill: white; opacity: 0; animation: finish .15s 2.02s forwards; }
    @keyframes write { 1% { opacity: 1; } to { opacity: 1; stroke-dasharray: var(--length) 0; } }
    @keyframes finish { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .guide, .complete, .dot { animation: none; opacity: 1; stroke-dasharray: var(--length) 0; } }
