<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 190" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Sin calligraphic signature</title>
  <desc id="description">A pen-drawn capital S, connected i and n, and a tapering flourish appear in writing order.</desc>
  <style>
    .ink { fill: #28282b; }
    .draw {
      fill: none;
      stroke: white;
      stroke-linecap: butt;
      stroke-linejoin: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      opacity: 0;
      animation: write var(--duration) cubic-bezier(.35, 0, .2, 1) var(--delay) both;
    }
    .s { --duration: 1.45s; --delay: .12s; }
    .in { --duration: 1.65s; --delay: 1.35s; }
    .dot { opacity: 0; animation: mark .15s ease-out 3s forwards; }
    @keyframes write {
      0% { opacity: 0; stroke-dashoffset: 100; }
      1% { opacity: 1; }
      100% { opacity: 1; stroke-dashoffset: 0; }
    }
    @keyframes mark { to { opacity: 1; } }
    @media (prefers-color-scheme: dark) { .ink { fill: #f6f3ed; } }
    @media (prefers-reduced-motion: reduce) {
      .draw { animation: none; opacity: 1; stroke-dashoffset: 0; }
      .dot { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <!-- Figma's variable-width pen strokes export as filled outlines. The animated
         centrelines reveal those outlines while retaining their pressure changes. -->
    <mask id="s-reveal" maskUnits="userSpaceOnUse" x="-8" y="-8" width="115" height="125">
